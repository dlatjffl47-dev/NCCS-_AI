<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>오늘의 제비뽑기</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202b25;
        --muted: #748078;
        --paper: #fffefa;
        --line: #e8e7df;
        --green: #245c43;
        --green-dark: #194733;
        --lime: #d7ed9b;
        --orange: #e98455;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 9% 12%, #e8eddb 0, transparent 30%),
          radial-gradient(ellipse at 94% 88%, #f3e7d8 0, transparent 27%),
          #f5f2eb;
        font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      button, textarea, input { font: inherit; }
      button { cursor: pointer; }

      .page { width: min(100%, 1080px); margin: 0 auto; }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 27px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      .brand { display: flex; align-items: center; gap: 9px; color: var(--green); }
      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 10px;
        color: white;
        background: var(--green);
        font-size: 17px;
      }
      .hero { margin-bottom: 28px; }
      .eyebrow {
        margin: 0 0 10px;
        color: #78834d;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .15em;
      }
      h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.06em; }
      .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }

      .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, .9fr); gap: 18px; }
      .card {
        padding: 27px;
        border: 1px solid rgba(32, 43, 37, .07);
        border-radius: 22px;
        background: var(--paper);
        box-shadow: 0 16px 45px rgba(48, 54, 43, .06);
      }
      .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
      .counter {
        padding: 6px 10px;
        border-radius: 20px;
        color: var(--green);
        background: #edf3e9;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      label { display: block; margin: 22px 0 9px; font-size: 13px; font-weight: 700; }
      .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
      textarea {
        display: block;
        width: 100%;
        min-height: 260px;
        resize: vertical;
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        outline: none;
        color: var(--ink);
        background: #fff;
        line-height: 1.8;
        transition: border-color .2s, box-shadow .2s;
      }
      textarea:focus, input:focus { border-color: #8ba78d; box-shadow: 0 0 0 3px #245c4316; }
      .control-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 21px; }
      .control-label { margin: 0; }
      .stepper {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .stepper button {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        color: var(--green);
        background: #f0f3eb;
        font-size: 19px;
      }
      .stepper button:hover { background: #e3ebdc; }
      #drawCount { width: 28px; border: 0; outline: 0; text-align: center; font-weight: 800; }
      .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 25px; }
      .draw-button, .reset-button {
        min-height: 50px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        transition: transform .15s, background .15s;
      }
      .draw-button { color: white; background: var(--green); }
      .draw-button:hover { transform: translateY(-1px); background: var(--green-dark); }
      .draw-button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
      .reset-button { padding: 0 17px; color: #657068; background: #f1f0eb; }
      .reset-button:hover { background: #e9e7df; }

      .result-card { display: flex; min-height: 100%; flex-direction: column; }
      .result-heading { margin-bottom: 20px; }
      .result-heading p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
      .result-area {
        display: grid;
        flex: 1;
        min-height: 345px;
        align-content: center;
        justify-items: center;
        padding: 24px;
        border: 1px dashed #d8ddcf;
        border-radius: 16px;
        background: #fafbf7;
        text-align: center;
      }
      .empty-icon { margin-bottom: 14px; font-size: 34px; }
      .empty-title { margin: 0; font-weight: 800; }
      .empty-copy { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .result-list { display: grid; width: 100%; gap: 10px; }
      .result-item {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 15px;
        border: 1px solid #e8ecdf;
        border-radius: 13px;
        background: white;
        text-align: left;
        animation: appear .35s both;
      }
      .result-item:nth-child(2) { animation-delay: .08s; }
      .result-item:nth-child(3) { animation-delay: .16s; }
      .result-item:nth-child(4) { animation-delay: .24s; }
      .result-item:nth-child(n+5) { animation-delay: .3s; }
      .number {
        display: grid;
        flex: 0 0 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        color: var(--green);
        background: #edf3e9;
        font-size: 12px;
        font-weight: 800;
      }
      .winner { font-size: 17px; font-weight: 800; }
      .result-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 17px; color: var(--muted); font-size: 12px; }
      .status { min-height: 20px; margin: 12px 0 0; color: #b64e36; font-size: 12px; }
      .footer { margin-top: 24px; color: #8b9188; font-size: 11px; text-align: center; }

      @keyframes appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 760px) {
        body { padding: 28px 15px; }
        .layout { grid-template-columns: 1fr; }
        .card { padding: 22px; }
        .result-area { min-height: 260px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> 모여봐요, 제비뽑기</div>
        <span>FAIR &amp; SIMPLE</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">오늘의 작은 결정</p>
        <h1 id="page-title">누가 뽑힐까요?</h1>
        <p class="subtitle">이름을 적고 버튼을 눌러보세요.<br />공정하고 간단하게, 오늘의 주인공을 뽑아드릴게요.</p>
      </section>

      <div class="layout">
        <section class="card" aria-labelledby="participants-heading">
          <div class="section-heading">
            <h2 id="participants-heading">참가자 입력</h2>
            <span class="counter" id="participantCount">0명 참여</span>
          </div>
          <label for="participants">이름 목록</label>
          <p class="hint">한 줄에 한 명씩 입력해 주세요.</p>
          <textarea id="participants" placeholder="예)&#10;김하늘&#10;이바다&#10;박새봄" spellcheck="false"></textarea>

          <div class="control-row">
            <label class="control-label" for="drawCount">몇 명을 뽑을까요?</label>
            <div class="stepper" aria-label="추첨 인원 조절">
              <button type="button" id="decrease" aria-label="추첨 인원 줄이기">−</button>
              <input id="drawCount" type="number" value="1" min="1" max="1" inputmode="numeric" aria-label="추첨 인원" />
              <button type="button" id="increase" aria-label="추첨 인원 늘리기">+</button>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="draw-button" id="drawButton">제비 뽑기 <span aria-hidden="true">→</span></button>
            <button type="button" class="reset-button" id="resetButton">초기화</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>

        <section class="card result-card" aria-labelledby="result-heading">
          <div class="result-heading">
            <h2 id="result-heading">추첨 결과</h2>
            <p>두근두근, 결과를 확인해 보세요.</p>
          </div>
          <div class="result-area" id="resultArea" aria-live="polite">
            <div>
              <div class="empty-icon" aria-hidden="true">🎟️</div>
              <p class="empty-title">아직 결과가 없어요</p>
              <p class="empty-copy">참가자 이름을 입력하고<br />제비를 뽑아보세요.</p>
            </div>
          </div>
          <div class="result-footer"><span id="resultSummary">행운의 주인공을 기다리는 중</span><span>🍀 GOOD LUCK</span></div>
        </section>
      </div>
      <footer class="footer">이름은 이 브라우저에서만 사용되며 저장되지 않아요.</footer>
    </main>

    <script>
      const participantsInput = document.querySelector("#participants");
      const countInput = document.querySelector("#drawCount");
      const participantCount = document.querySelector("#participantCount");
      const drawButton = document.querySelector("#drawButton");
      const status = document.querySelector("#status");
      const resultArea = document.querySelector("#resultArea");
      const resultSummary = document.querySelector("#resultSummary");

      function getParticipants() {
        return participantsInput.value.split(/\r?\n/).map((name) => name.trim()).filter(Boolean);
      }

      function updateControls() {
        const total = getParticipants().length;
        participantCount.textContent = `${total}명 참여`;
        countInput.max = String(Math.max(total, 1));
        countInput.value = String(Math.min(Math.max(Number.parseInt(countInput.value, 10) || 1, 1), Math.max(total, 1)));
        drawButton.disabled = total === 0;
      }

      function showMessage(message) {
        status.textContent = message;
      }

      participantsInput.addEventListener("input", () => {
        showMessage("");
        updateControls();
      });

      document.querySelector("#decrease").addEventListener("click", () => {
        countInput.value = String(Math.max(1, (Number.parseInt(countInput.value, 10) || 1) - 1));
      });
      document.querySelector("#increase").addEventListener("click", () => {
        countInput.value = String(Math.min(getParticipants().length, (Number.parseInt(countInput.value, 10) || 1) + 1));
      });
      countInput.addEventListener("change", updateControls);

      drawButton.addEventListener("click", () => {
        const names = getParticipants();
        const drawCount = Number.parseInt(countInput.value, 10);
        if (names.length === 0) {
          showMessage("참가자 이름을 한 명 이상 입력해 주세요.");
          return;
        }
        if (!Number.isInteger(drawCount) || drawCount < 1 || drawCount > names.length) {
          showMessage(`추첨 인원은 1명부터 ${names.length}명까지 선택할 수 있어요.`);
          return;
        }

        const shuffled = [...names];
        for (let i = shuffled.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const winners = shuffled.slice(0, drawCount);
        const list = document.createElement("div");
        list.className = "result-list";
        winners.forEach((name, index) => {
          const item = document.createElement("div");
          item.className = "result-item";
          const number = document.createElement("span");
          number.className = "number";
          number.textContent = `${String(index + 1).padStart(2, "0")}`;
          const winner = document.createElement("span");
          winner.className = "winner";
          winner.textContent = name;
          item.append(number, winner);
          list.append(item);
        });
        resultArea.replaceChildren(list);
        resultSummary.textContent = `${names.length}명 중 ${drawCount}명 추첨 완료`;
        showMessage("");
      });

      document.querySelector("#resetButton").addEventListener("click", () => {
        participantsInput.value = "";
        countInput.value = "1";
        resultArea.innerHTML = '<div><div class="empty-icon" aria-hidden="true">🎟️</div><p class="empty-title">아직 결과가 없어요</p><p class="empty-copy">참가자 이름을 입력하고<br />제비를 뽑아보세요.</p></div>';
        resultSummary.textContent = "행운의 주인공을 기다리는 중";
        showMessage("");
        updateControls();
        participantsInput.focus();
      });

      updateControls();
    </script>
  </body>
</html>
